[package]
name = "uniffi-bindgen-java-jni"
version = "0.1.0"
edition = "2024"
description = "A standalone Java JNI external binding generator for UniFFI. Generates Java native source files and a Rust JNI glue crate from UniFFI metadata, enabling Java to call Rust-exported UniFFI interfaces via JNI."
license = "MPL-2.0"
repository = "https://github.com/moheng233/uniffi-bindgen-java-jni"
homepage = "https://github.com/moheng233/uniffi-bindgen-java-jni"
documentation = "https://github.com/moheng233/uniffi-bindgen-java-jni"
keywords = ["uniffi", "ffi", "bindings", "java", "jni"]
categories = ["development-tools::ffi", "api-bindings"]
readme = "README.md"
exclude = [
    "PLAN.md",
    "STATUS.md"
]

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
camino = "1.2.2"
clap = { version = "4.6.1", features = ["derive"] }
fs-err = "3.3.0"
heck = "0.5.0"
indexmap = "2.14.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
uniffi_bindgen = { version = "0.31.1", default-features = false }
uniffi_internal_macros = "0.31.1"
uniffi_pipeline = "0.31.1"
